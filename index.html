<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="INFINIXONE — Comunicate con nosotros directamente por WhatsApp.">
  <meta name="theme-color" content="#0b0b14">
  <title>INFINIXONE | Contacto</title>

  <style>
    :root {
      --bg: #08080f;
      --card: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.14);
      --text: #fff;
      --muted: #b9b9c7;
      --purple: #9b5cff;
      --yellow: #ffd447;
      --whatsapp: #25d366;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(3, 4, 14, .48), rgba(3, 4, 14, .62)),
        url("11268.jpg") center center / cover fixed no-repeat;
      overflow-x: hidden;
    }

    .glow { display:none;
      
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .22;
      pointer-events: none;
      z-index: 0;
    }

    .glow.one { background: var(--purple); top: -90px; left: -90px; }
    .glow.two { background: var(--yellow); bottom: -120px; right: -90px; }

    .card {
      position: relative;
      z-index: 1;
      width: min(460px, 100%);
      padding: 42px 28px 30px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.5);
      animation: enter .7s ease both;
    }

    .logo {
      width: 108px;
      height: 108px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--yellow));
      color: #17121f;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
      box-shadow: 0 0 45px rgba(155,92,255,.4);
    }

    .badge {
      display: inline-block;
      margin-bottom: 15px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #ddd;
      background: rgba(255,255,255,.05);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 9vw, 42px);
      letter-spacing: 2px;
      line-height: 1.05;
    }

    .headline {
      margin: 14px auto 10px;
      max-width: 360px;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.35;
    }

    .description {
      margin: 0 auto 28px;
      max-width: 370px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 16px 20px;
      border-radius: 16px;
      color: #061109;
      background: var(--whatsapp);
      text-decoration: none;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(37,211,102,.22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(37,211,102,.32);
    }

    .btn:active { transform: translateY(0); }

    .share-btn {
      width: 100%;
      min-height: 52px;
      margin-top: 12px;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 15px;
      color: #fff;
      background: rgba(255,255,255,.06);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .share-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.11);
    }

    .message {
      min-height: 18px;
      margin-top: 10px;
      color: #bfeecf;
      font-size: 12px;
    }

    .info {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      color: #a9a9b6;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--whatsapp);
      box-shadow: 0 0 10px rgba(37,211,102,.7);
    }

    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #858594;
      font-size: 11px;
      letter-spacing: .4px;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 34px 20px 25px; border-radius: 25px; }
      .logo { width: 92px; height: 92px; font-size: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>

<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="card">
    <div class="logo" aria-label="INFINIXONE">INFX</div>

    <div class="badge">Acceso rápido</div>

    <h1>INFINIXONE</h1>

    <p class="headline">🔥 30% DE BONIFICACIÓN 🔥</p>

    <p class="headline">Entrá y comunicate con nosotros</p>

    <p class="description">
      Tocá el botón y hablá directamente con INFINIXONE por WhatsApp.
    </p>

    <a
      class="btn"
      href="https://wa.me/5491172797411?text=Hola%2C%20quiero%20hacer%20una%20consulta%20con%20INFINIXONE."
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Entrar a INFINIXONE por WhatsApp"
    >
      <span aria-hidden="true">🚀</span>
      ENTRAR A INFINIXONE
    </a>

    <button class="share-btn" type="button" onclick="sharePage()">
      <span aria-hidden="true">↗️</span>
      COMPARTIR ESTE LINK
    </button>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div class="info">
      <span class="dot"></span>
      <span>Atención directa por WhatsApp</span>
    </div>

    <div class="footer">
      INFINIXONE · Acceso oficial
    </div>
  </main>

  <script>
    async function sharePage() {
      const data = {
        title: "INFINIXONE",
        text: "Entrá a INFINIXONE y comunicate con nosotros.",
        url: window.location.href
      };

      const message = document.getElementById("message");

      if (navigator.share) {
        try {
          await navigator.share(data);
          return;
        } catch (error) {
          if (error.name === "AbortError") return;
        }
      }

      try {
        await navigator.clipboard.writeText(window.location.href);
        message.textContent = "✓ Link copiado. Ya podés compartirlo.";
      } catch (error) {
        message.textContent = "Mantené presionado el enlace para copiarlo.";
      }
    }
  </script>

</body>
</html>
